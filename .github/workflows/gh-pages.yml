name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🛠️ Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: 📦 Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: 🏗️ Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 🔍 Upload Search Index to Algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: |
          npm install algoliasearch
          node -e "
            const algoliasearch = require('algoliasearch');
            const fs = require('fs');
            
            const client = algoliasearch(process.env.ALGOLIA_APP_ID, process.env.ALGOLIA_ADMIN_KEY);
            const index = client.initIndex(process.env.ALGOLIA_INDEX_NAME);
            const records = JSON.parse(fs.readFileSync('./public/index.json', 'utf8'));
            
            index.replaceAllObjects(records, { autoGenerateObjectIDIfNotExist: true })
              .then(({ objectIDs }) => {
                console.log('✅ Successfully indexed ' + objectIDs.length + ' records to Algolia');
              })
              .catch(err => {
                console.error('❌ Error:', err);
                process.exit(1);
              });
          "

      - name: 🌐 Create CNAME for Custom Domain
        run: echo "weizicoding.cn" > ./public/CNAME

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
